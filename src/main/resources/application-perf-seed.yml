spring:
  datasource:
    url: jdbc:mysql://localhost:3308/shelfeed?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: shelfeed
    password: shelfeed
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10        # t3.medium 시뮬레이션 — 커넥션 고갈 재현
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

aladin:
  api:
    ttbkey: mock-key-not-used
    version: "20131101"

management:
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 0.1   # 부하 테스트 중 10% 샘플링 - 오버헤드 최소화하면서 P95 슬로우 요청 추적
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

app:
  search:
    history-enabled: false  # 검색 히스토리 락 경합 제거 — LIKE 풀스캔 병목만 순수 측정

info:
  profile: mock-aladin,perf-seed
